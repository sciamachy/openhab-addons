thing.generacmobilelink.account.offline.configuration-error.mfa-unsupported = The account uses a second factor the binding cannot complete. Switch it to an authenticator app, SMS or email codes, then save the configuration again.
thing.generacmobilelink.account.offline.configuration-error.interaction-required = The login shows a step that needs a person. Sign in to the MobileLink app, complete it there, then save the bridge configuration again.
thing.generacmobilelink.account.offline.configuration-pending.mfa-otp = Enter the current code from your authenticator app as MFA Code
thing.generacmobilelink.account.offline.configuration-pending.mfa-sms = Enter the code sent to you by SMS as MFA Code
thing.generacmobilelink.account.offline.configuration-pending.mfa-email = Enter the code sent to you by email as MFA Code
thing.generacmobilelink.account.offline.configuration-pending.mfa-code-rejected = MFA Code not accepted, enter a new one
thing.generacmobilelink.account.offline.configuration-pending.mfa-expired = No MFA Code was entered in time. Save the configuration to start a new login.
